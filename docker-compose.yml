# GymLeader in one container: llama-server + API + web page. Open http://127.0.0.1:8000
#   docker compose up -d            # pulls the published image; builds it from this checkout if it isn't published
#   docker compose up -d --build    # always builds from this checkout
#   docker compose logs -f          # the first start downloads the model (2.1 GB) into the volume
# The two-container setup of step 16c (llama.cpp's own image + docker/api.Dockerfile) is in docker-compose.dev.yml.
services:
  gymleader:
    image: ghcr.io/riccardoroselli/gymleader:v1.0
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Compose file reference, "pull_policy": missing = pull only if the image isn't on this machine. With build: set,
    # a failed pull (not published yet) falls back to the build (checked with Compose v5.5.1).
    pull_policy: missing
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - gymleader-models:/models
    restart: unless-stopped
    environment:
      - HF_TOKEN            # passed only if set; see src/serve.py for LLAMA_ARGS etc.

volumes:
  gymleader-models:
    name: gymleader-models  # no project prefix: the same volume as `docker run -v gymleader-models:/models`
