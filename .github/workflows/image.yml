# Builds docker/Dockerfile for linux/amd64 + linux/arm64 (each on its own native runner) and pushes it to
# ghcr.io/riccardoroselli/gymleader on a v* tag push. A manual run builds without pushing unless push is ticked,
# and pushes only if it was started from a v* tag (a branch has no image tag to push to).
# Tags: the git tag exactly (v1.0, v1.0-rc1); latest only for tags without "-".
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to ghcr.io (only from a v* tag)"
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    # docker/github-builder v1.19.0 (= v1 on 19 Nov 2026). build.yml has no permissions block of its own: its jobs
    # get only what is granted here. packages: write as in its own GHCR test job (.test-build.yml, build-ghcr).
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read  # check out the repository
      id-token: write # sign the provenance attestation and cache entries (GitHub OIDC)
      packages: write # push to ghcr.io with GITHUB_TOKEN
    with:
      output: image
      file: docker/Dockerfile
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-latest
        linux/arm64=ubuntu-24.04-arm
      push: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.push) }}
      # max: also cache the llama.cpp build stage, which isn't in the final image (min would rebuild it every time)
      cache: true
      cache-mode: max
      meta-images: ghcr.io/riccardoroselli/gymleader
      # metadata-action README, "flavor input" and "Latest tag": the default latest=auto adds latest for every
      # type=ref,event=tag, rc tags included (it tagged v1.0-rc2 latest). build.yml passes meta-flavor to its flavor
      # input. false: latest comes only from the type=raw rule below.
      meta-flavor: latest=false
      meta-tags: |
        type=ref,event=tag
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      # source, revision, version, created from the repo; title/description as in the Dockerfile (no commas: list input)
      set-meta-labels: true
      set-meta-annotations: true # GHCR shows a multi-arch image's description from the index annotation
      meta-labels: |
        org.opencontainers.image.title=GymLeader
        org.opencontainers.image.description=Gym workouts from plain requests: a fine-tuned Qwen3.5-2B on llama.cpp b12360 (2d8a32502) checked against an exercise catalog. Web page on port 8000.
        org.opencontainers.image.licenses=Apache-2.0
      meta-annotations: |
        org.opencontainers.image.title=GymLeader
        org.opencontainers.image.description=Gym workouts from plain requests: a fine-tuned Qwen3.5-2B on llama.cpp b12360 (2d8a32502) checked against an exercise catalog. Web page on port 8000.
        org.opencontainers.image.licenses=Apache-2.0
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    # The pushed image on each architecture: llama-server and its libraries load, and it is the b12360 build.
    # No model download. digest is empty when nothing was pushed, so this job is skipped then.
    needs: build
    if: needs.build.outputs.digest != ''
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read # pull while the GHCR package is still private
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: llama-server --version
        env:
          IMAGE: ghcr.io/riccardoroselli/gymleader@${{ needs.build.outputs.digest }}
        run: |
          out=$(docker run --rm --entrypoint llama-server "$IMAGE" --version 2>&1)
          echo "$out"
          grep -qF "build 12360, commit 2d8a32502" <<<"$out"  # e.g. "version: 1.0.0-dev (build 12360, commit 2d8a32502)"
